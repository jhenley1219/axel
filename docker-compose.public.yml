# Public compose file for Axel. Two ways to use it:
#
#   1) Quick start (mounts your entire home directory):
#        docker compose -f docker-compose.public.yml up -d --build
#
#   2) Isolated mode (mounts only one project directory you choose):
#        npx axel-docker-init
#      Generates Dockerfile.user.generated and docker-compose.user.yml,
#      then builds and runs them. See bin/axel-docker-init.js.
services:
  axel:
    build:
      context: .
      dockerfile: Dockerfile.public
    image: axel-base:latest
    ports:
      - "8080:8080"
    environment:
      - REQUIRE_AUTH=true
    volumes:
      - axel-audit:/data/audit
      - axel-home:/home/axel
      - axel-claude-auth:/home/axel/.claude
      - axel-projects:/projects
      # Mount the host's home directory into the container at the same path.
      # This lets the Browse button in Settings navigate your real files,
      # and lets the agent work in any folder you pick. For an isolated
      # single-project setup instead, use `npx axel-docker-init`.
      - ${HOME}:${HOME}
    restart: unless-stopped

volumes:
  axel-audit:
  axel-home:
  axel-claude-auth:
  axel-projects:
