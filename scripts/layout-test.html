<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Axel Layout Test — Node Auto-Spacing</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #09090f;
      font-family: 'SF Mono', 'Fira Code', monospace;
      overflow: hidden;
      color: #d0d0d0;
    }

    #canvas {
      position: relative;
      width: 100vw;
      height: 100vh;
    }

    /* ── Centre orb ── */
    #orb {
      position: absolute;
      width: 88px; height: 88px;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle at 40% 38%,
        rgba(90,110,230,0.28) 0%,
        rgba(50,60,160,0.10) 55%,
        transparent 100%);
      border: 1px solid rgba(120,130,255,0.18);
      pointer-events: none;
      z-index: 0;
    }

    /* ── Node shell ── */
    .node {
      position: absolute;
      transform: translate(-50%, -50%);
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.10);
      background: rgba(18,18,28,0.94);
      overflow: hidden;
      pointer-events: none;
      /* smooth size transition so you can watch the layout react */
      transition: width 0.35s ease, height 0.35s ease,
                  border-color 0.35s ease, background 0.35s ease;
      box-shadow: 0 4px 28px rgba(0,0,0,0.55);
      z-index: 1;
    }

    .node-header {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 7px 10px;
      border-bottom: 1px solid rgba(255,255,255,0.07);
      font-size: 11px;
      white-space: nowrap;
      overflow: hidden;
    }
    .node-label { font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; }
    .node-kind  { color: rgba(255,255,255,0.28); font-size: 9px; flex-shrink: 0; }

    .node-body {
      padding: 6px 10px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      overflow: hidden;
      height: calc(100% - 32px);
    }

    .term-line {
      font-size: 9.5px;
      line-height: 1.45;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .term-line.prompt { color: rgba(120,220,160,0.80); }
    .term-line.out    { color: rgba(200,200,200,0.55); }
    .term-line.dim    { color: rgba(150,150,150,0.35); }

    /* ── Status dot ── */
    .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot-idle    { background: #3a3a4a; }
    .dot-running { background: #4ecb71; animation: blink 1.1s ease-in-out infinite; }
    @keyframes blink { 0%,100%{ opacity:1 } 50%{ opacity:0.35 } }

    /* ── Kind-specific borders/tints ── */
    .node-agent { border-color: rgba(90,180,255,0.22); background: rgba(8,18,38,0.95); }
    .node-sub   { border-color: rgba(170,130,255,0.18); background: rgba(18,12,32,0.95); }
    .node-tool  { border-color: rgba(255,170,80,0.18); background: rgba(28,18,8,0.95); }
    .node-dir-open  { border-color: rgba(70,200,110,0.25); background: rgba(8,26,16,0.95); }
    .node-dir-closed { /* default */ }

    /* ── HUD ── */
    #hud {
      position: fixed;
      bottom: 18px; left: 18px;
      background: rgba(0,0,0,0.65);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 11px;
      color: rgba(255,255,255,0.5);
      max-width: 420px;
      line-height: 1.6;
      z-index: 10;
    }
    #hud b { color: rgba(255,255,255,0.8); }

    #timer {
      position: fixed;
      top: 18px; right: 18px;
      font-size: 12px;
      color: rgba(255,255,255,0.28);
      z-index: 10;
      text-align: right;
      line-height: 1.8;
    }
    #timer span { display: block; }
    #timer .hi { color: rgba(120,220,160,0.7); }
  </style>
</head>
<body>
  <div id="canvas">
    <div id="orb"></div>
  </div>

  <div id="hud">
    <b>Axel Layout Test</b><br>
    <span id="hud-msg">Physics settling…</span>
  </div>

  <div id="timer">
    <span id="t-next">next shuffle: 20s</span>
    <span id="t-open" class="hi"></span>
  </div>

<script>
// ─────────────────────────────────────────
//  Physics constants  (mirrors graph.ts)
// ─────────────────────────────────────────
const DAMP     = 0.87;
const PIN_K    = 0.20;
const REPULSE  = 0.62;
const MAX_V    = 8;
const ORB_R    = 44 + 20;          // orb radius + clearance margin
const BAND_LO  = 0.14;             // annular band inner fraction
const BAND_HI  = 0.56;             // annular band outer fraction
const GAP      = 10;               // extra pixel gap between bboxes

// Node extents (px)  — matches NODE_EXTENT in graph.ts
const EXT = {
  'dir-sm':  { w: 168, h:  44 },
  'dir-lg':  { w: 300, h: 200 },
  'agent':   { w: 300, h: 200 },
  'sub':     { w: 240, h: 160 },
  'tool':    { w: 168, h:  96 },
};

function ext(nd) {
  if (nd.kind === 'dir') return nd.open ? EXT['dir-lg'] : EXT['dir-sm'];
  return EXT[nd.kind];
}

// ─────────────────────────────────────────
//  Node definitions
// ─────────────────────────────────────────
const NODES = [
  { id:'n1',  label:'axel / src',      kind:'dir',   open:false },
  { id:'n2',  label:'axel / apps',     kind:'dir',   open:false },
  { id:'n3',  label:'axel / packages', kind:'dir',   open:false },
  { id:'n4',  label:'axel / scripts',  kind:'dir',   open:false },
  { id:'n5',  label:'axel / docs',     kind:'dir',   open:false },
  { id:'n6',  label:'Claude Agent',    kind:'agent',  open:true  },
  { id:'n7',  label:'Sub Task A',      kind:'sub',   open:true  },
  { id:'n8',  label:'Sub Task B',      kind:'sub',   open:false },
  { id:'n9',  label:'git',             kind:'tool',  open:false },
  { id:'n10', label:'fs',              kind:'tool',  open:false },
  { id:'n11', label:'search',          kind:'tool',  open:false },
];

// ─────────────────────────────────────────
//  Sample terminal content
// ─────────────────────────────────────────
const PROMPTS = [
  '$ claude run --task review',
  '$ git diff HEAD~1',
  '$ ls -la src/',
  '$ npm test --silent',
  '$ grep -r "TODO" .',
  '$ cat package.json',
  '$ node scripts/build.mjs',
  '$ git log --oneline -5',
];
const OUTPUT = [
  'Reading 42 files…',
  'Analyzing src/index.ts',
  'Found 3 patterns to review',
  'PASS src/utils.test.ts',
  'All tests passed (12 suites)',
  'On branch main, nothing to commit',
  'Build complete: dist/ ready',
  '> Processing request…',
  'total 48 (8 modified)',
  'ea33cfe Remove nixpacks.toml',
  'ac1502a Replace Dockerfile',
  'Done in 1.42s',
];

function randomLines() {
  const lines = [];
  const count = 5 + Math.floor(Math.random() * 5);
  for (let i = 0; i < count; i++) {
    if (Math.random() < 0.38) {
      lines.push({ cls:'prompt', text: PROMPTS[Math.floor(Math.random()*PROMPTS.length)] });
    } else {
      lines.push({ cls: Math.random()<0.5?'out':'dim',
                   text: OUTPUT[Math.floor(Math.random()*OUTPUT.length)] });
    }
  }
  return lines;
}

// Cache term content so it doesn't regenerate every frame
const termCache = {};
NODES.forEach(nd => { termCache[nd.id] = randomLines(); });

// ─────────────────────────────────────────
//  Viewport
// ─────────────────────────────────────────
let W = window.innerWidth, H = window.innerHeight;
const orbEl = document.getElementById('orb');

function placeOrb() {
  orbEl.style.left = (W/2)+'px';
  orbEl.style.top  = (H/2)+'px';
}
placeOrb();
window.addEventListener('resize', () => {
  W = window.innerWidth; H = window.innerHeight;
  placeOrb();
  clamp();
});

// ─────────────────────────────────────────
//  Sim state
// ─────────────────────────────────────────
let sim = [];   // { id, x, y, vx, vy, hw, hh }

function initSim() {
  const cx = W/2, cy = H/2;
  const r  = Math.min(W,H) * 0.30;
  sim = NODES.map((nd, i) => {
    const angle = (i / NODES.length) * Math.PI * 2 - Math.PI/2;
    const e = ext(nd);
    return { id:nd.id, x: cx+Math.cos(angle)*r, y: cy+Math.sin(angle)*r,
             vx:0, vy:0, hw:e.w/2, hh:e.h/2 };
  });
}
initSim();

function syncExtents() {
  NODES.forEach((nd,i) => {
    const e = ext(nd);
    sim[i].hw = e.w/2;
    sim[i].hh = e.h/2;
  });
}

function clamp() {
  sim.forEach(s => {
    s.x = Math.max(s.hw+16, Math.min(W-s.hw-16, s.x));
    s.y = Math.max(s.hh+16, Math.min(H-s.hh-16, s.y));
  });
}

// ─────────────────────────────────────────
//  Physics tick
// ─────────────────────────────────────────
function tick() {
  const cx = W/2, cy = H/2;
  const rMin = Math.min(W,H) * BAND_LO;
  const rMax = Math.min(W,H) * BAND_HI;

  // Band + orb forces
  for (const s of sim) {
    const dx = s.x-cx, dy = s.y-cy;
    const r  = Math.hypot(dx,dy) || 1;
    const ux = dx/r, uy = dy/r;

    // Annular band
    let f = 0;
    if (r < rMin) f = (rMin-r)*0.045;
    else if (r > rMax) f = (rMax-r)*0.045;
    s.vx += ux*f;
    s.vy += uy*f;

    // Orb clearance
    if (r < ORB_R) {
      const push = (ORB_R-r)*0.14;
      s.vx += ux*push;
      s.vy += uy*push;
    }
  }

  // Pairwise AABB repulsion (N²)
  for (let i = 0; i < sim.length; i++) {
    for (let j = i+1; j < sim.length; j++) {
      const a = sim[i], b = sim[j];
      const dx = b.x-a.x, dy = b.y-a.y;
      const ox = (a.hw+b.hw+GAP) - Math.abs(dx);
      const oy = (a.hh+b.hh+GAP) - Math.abs(dy);
      if (ox > 0 && oy > 0) {
        // Push along shortest axis
        const dist = Math.hypot(dx,dy)||1;
        const ux = dx/dist, uy = dy/dist;
        const imp = Math.min(ox,oy)*REPULSE;
        a.vx -= ux*imp*0.5; a.vy -= uy*imp*0.5;
        b.vx += ux*imp*0.5; b.vy += uy*imp*0.5;
      }
    }
  }

  // Integrate, damp, cap
  for (const s of sim) {
    s.vx *= DAMP; s.vy *= DAMP;
    const sp = Math.hypot(s.vx,s.vy);
    if (sp > MAX_V) { s.vx = s.vx/sp*MAX_V; s.vy = s.vy/sp*MAX_V; }
    s.x += s.vx; s.y += s.vy;
  }
  clamp();
}

// Burst: run N ticks synchronously to pre-resolve overlaps
function burst(n) { for (let i=0;i<n;i++) tick(); }

// ─────────────────────────────────────────
//  DOM: create node elements once
// ─────────────────────────────────────────
const canvas  = document.getElementById('canvas');
const domMap  = {};

NODES.forEach(nd => {
  const el = document.createElement('div');
  el.className = 'node';
  el.id = 'nd-'+nd.id;
  domMap[nd.id] = el;
  canvas.appendChild(el);
});

function kindClass(nd) {
  if (nd.kind==='agent') return 'node-agent';
  if (nd.kind==='sub')   return 'node-sub';
  if (nd.kind==='tool')  return 'node-tool';
  return nd.open ? 'node-dir-open' : 'node-dir-closed';
}

function kindLabel(nd) {
  if (nd.kind==='dir')   return nd.open ? 'dir · terminal' : 'dir';
  if (nd.kind==='agent') return 'agent';
  if (nd.kind==='sub')   return 'sub-agent';
  return 'tool';
}

function buildNodeHTML(nd) {
  const dotCls = nd.open ? 'dot dot-running' : 'dot dot-idle';
  let html = `<div class="node-header">
    <span class="${dotCls}"></span>
    <span class="node-label">${nd.label}</span>
    <span class="node-kind">${kindLabel(nd)}</span>
  </div>`;

  if (nd.open) {
    const lines = termCache[nd.id];
    html += `<div class="node-body">`;
    for (const l of lines) {
      html += `<div class="term-line ${l.cls}">${l.text}</div>`;
    }
    html += `</div>`;
  } else if (nd.kind !== 'dir') {
    html += `<div class="node-body"><span style="color:rgba(255,255,255,0.22);font-size:10px">idle</span></div>`;
  }
  return html;
}

function applyNodeDOM(nd) {
  const el  = domMap[nd.id];
  const e   = ext(nd);
  el.style.width  = e.w+'px';
  el.style.height = e.h+'px';
  el.className = 'node '+kindClass(nd);
  el.innerHTML = buildNodeHTML(nd);
}

// Initial full render
NODES.forEach(applyNodeDOM);

// ─────────────────────────────────────────
//  RAF render loop: only update positions
// ─────────────────────────────────────────
function renderPositions() {
  NODES.forEach((nd,i) => {
    const s  = sim[i];
    const el = domMap[nd.id];
    el.style.left = s.x+'px';
    el.style.top  = s.y+'px';
  });
}

function rafLoop() {
  tick();
  renderPositions();
  requestAnimationFrame(rafLoop);
}

// Let it settle before starting the auto-shuffle
burst(120);
renderPositions();
requestAnimationFrame(rafLoop);

// ─────────────────────────────────────────
//  Shuffle: randomly open/close dir terminals
// ─────────────────────────────────────────
const dirIds = NODES.filter(nd => nd.kind==='dir').map(nd=>nd.id);

function shuffle() {
  // Toggle 1-2 random dir nodes
  const targets = [...dirIds]
    .sort(()=>Math.random()-0.5)
    .slice(0, 1 + Math.floor(Math.random()*2));

  const changes = [];
  targets.forEach(id => {
    const nd = NODES.find(n=>n.id===id);
    nd.open = !nd.open;
    if (nd.open) termCache[id] = randomLines();  // fresh lines on open
    applyNodeDOM(nd);   // update size + content immediately
    changes.push(`<b>${nd.label}</b> → ${nd.open?'<span style="color:#4ecb71">open</span>':'close'}`);
  });

  // Sync extents into sim then burst-settle
  syncExtents();
  burst(100);

  const openCount = NODES.filter(nd=>nd.open).length;
  document.getElementById('hud-msg').innerHTML =
    changes.join(' &nbsp;·&nbsp; ');
  document.getElementById('t-open').textContent =
    `${openCount} terminal${openCount!==1?'s':''} open`;
}

// Countdown ticker
let cd = 20;
const tNext = document.getElementById('t-next');

function countdownTick() {
  cd--;
  if (cd <= 0) {
    shuffle();
    cd = 20;
  }
  tNext.textContent = `next shuffle: ${cd}s`;
}

// Show initial open count
document.getElementById('t-open').textContent =
  `${NODES.filter(n=>n.open).length} terminals open`;

setInterval(countdownTick, 1000);
</script>
</body>
</html>
